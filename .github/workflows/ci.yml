name: RotaClub CI - Typecheck, Tests, Build and Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  verify-rotaclub:
    name: Typecheck, Unit/API Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck (npm run lint is tsc --noEmit)
        run: npm run lint

      - name: Unit and API integration regression tests
        run: npm test

      - name: Build frontend bundle
        run: npm run build

  security-baseline:
    name: Secret Scan and Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate CI provenance and negative policy fixtures
        run: |
          node scripts/check-ci-policy.mjs --self-test
          node scripts/check-ci-policy.mjs

      - name: Verify secret scanner detects planted fixtures
        run: node scripts/check-secrets.mjs --self-test

      - name: Adversarial scanner tests (Git and no-Git exports)
        run: node --test scripts/check-secrets.test.mjs

      - name: Scan tracked files for high-confidence secrets
        run: node scripts/check-secrets.mjs

      - name: Audit production dependencies for high or critical advisories
        run: npm audit --omit=dev --audit-level=high
