name: RotaClub CI — Güvenlik, RBAC, Entegrasyon Testleri & Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  verify-rotaclub:
    name: TypeScript, Birim & Sunucu RBAC Entegrasyon Testleri
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RotaClub Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck (npm run lint)
        run: npm run lint

      - name: Run Unit & Server RBAC / Audit Hash-Chain Integration Tests (npm test)
        run: npm test

      - name: Verify Production Frontend Build (npm run build)
        run: npm run build
